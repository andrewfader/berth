[package]
name = "berth"
version = "0.1.0"
edition = "2024"
description = "A dock and window switcher for the COSMIC desktop"
license = "MIT"
repository = "https://github.com/andrewfader/berth"
publish = false

[profile.release]
lto = "thin"
panic = "abort"

[dependencies]
anyhow = "1.0.104"
calloop = { version = "0.14.5", features = ["signals"] }
calloop-wayland-source = "0.4.1"
clap = { version = "4.6.8", features = ["derive"] }
cosmic-client-toolkit = { git = "https://github.com/pop-os/cosmic-protocols", version = "0.2.0" }
cosmic-text = "0.19.0"
env_logger = "0.11.11"
freedesktop-desktop-entry = "0.8.4"
freedesktop-icons = "0.4.0"
log = "0.4.35"
nix = { version = "0.31.3", default-features = false, features = ["signal", "socket", "user"] }
resvg = { version = "0.50.0", default-features = false, features = ["raster-images"] }
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }
tiny-skia = "0.12.0"
toml = "1.2.1"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }

[dev-dependencies]
tempfile = "3.27.0"
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
xkbcommon = "0.8.0"
